<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Geo AES Anniversary Edition - COUNTDOWN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #ead27d;
    --blue: #00d9ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: 'Orbitron', sans-serif;
    color: white;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

img {
    -webkit-user-drag: none;
    user-drag: none;
}

.crt {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-size: cover;
    background-position: center;
    transition: background-image 1.2s ease-in-out;
}

.crt::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.6) 100%);
    z-index: 10;
}

.crt::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );
    z-index: 11;
}

.crt.glitch {
    animation: glitch 0.15s infinite;
}

@keyframes glitch {
    0% { filter: hue-rotate(0deg) contrast(1); transform: translate(0,0); }
    25% { filter: hue-rotate(20deg) contrast(1.4); transform: translate(2px,-2px); }
    50% { filter: hue-rotate(-20deg) contrast(1.6); transform: translate(-2px,2px); }
    75% { filter: hue-rotate(10deg) contrast(1.3); transform: translate(1px,-1px); }
    100% { filter: hue-rotate(0deg) contrast(1); transform: translate(0,0); }
}

.floating-logo {
    position: absolute;
    width: 92px;
    height: 92px;
    z-index: 999;
    opacity: 0.92;
    animation: rotateLogo 7s linear infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)) drop-shadow(0 0 20px rgba(230,0,18,0.55));
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
}


@keyframes rotateLogo {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.container {
    position: relative;
    z-index: 20;
    text-align: center;
    padding: 50px 60px;
    border: 4px solid white;
    background: rgba(0,0,0,0.72);
    min-width: 900px;
    max-width: 95vw;
}

.main-logo {
    width: 380px;
    max-width: 90%;
    margin-bottom: 30px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.time-box {
    min-width: 140px;
    padding: 14px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
}

.number {
    font-size: 44px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(234,210,125,0.5);
}

.label {
    font-size: 10px;
    color: var(--blue);
    margin-top: 10px;
}

.footer {
    margin-top: 30px;
    font-size: 11px;
    color: var(--gold);
    opacity: 0.8;
    letter-spacing: 2px;
}

.links-section {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.links-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

.coupon-text {
    font-size: 10px;
    color: var(--blue);
    letter-spacing: 1px;
    margin-bottom: 5px;
    text-shadow: 0 0 5px rgba(0,217,255,0.4);
}

.coupon-text span {
    font-weight: 900;
    font-size: 13px;
    background: rgba(0, 217, 255, 0.1);
    padding: 3px 8px;
    border: 1px dashed var(--blue);
    border-radius: 3px;
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    color: white;
    cursor: pointer;
    position: relative;
}

.coupon-text span:active {
    transform: scale(0.95);
}

.link-btn {
    display: inline-block;
    padding: 10px 16px;
    background: rgba(234, 210, 125, 0.05);
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(234, 210, 125, 0.1);
}

.link-btn:hover {
    background: rgba(234, 210, 125, 0.2);
    box-shadow: 0 0 20px rgba(234, 210, 125, 0.4);
    color: white;
    border-color: white;
    transform: translateY(-2px);
}

.legal-footer {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    font-size: 8px;
    opacity: 0.5;
    z-index: 30;
}



@media (max-width: 768px) {
    body { overflow-y: auto; }

    .container {
        min-width: unset;
        width: 92%;
        padding: 30px 15px;
    }

    .main-logo { width: 220px; }

    .countdown {
        flex-direction: row;
        gap: 10px;
        justify-content: center;
    }

    .time-box {
        min-width: 75px;
        flex: 1 1 75px;
        padding: 10px 5px;
    }

    .number { font-size: 24px; }
    .label { font-size: 8px; margin-top: 5px; }

    .floating-logo {
        width: 50px;
        height: 50px;
    }

    .slug-character {
        width: 40px;
        height: 40px;
        bottom: 10px;
    }

    .progress-section {
        margin-top: 20px;
        max-width: 100%;
    }

    .progress-label {
        font-size: 8px;
    }

    .link-btn {
        padding: 8px 12px;
        font-size: 9px;
    }

    .arcade-hud {
        bottom: 15px;
        right: 15px;
    }
    .insert-coin-text { font-size: 12px; }
    .credit-counter { font-size: 10px; }
}

.arcade-hud {
    position: absolute;
    bottom: 25px;
    right: 30px;
    text-align: right;
    z-index: 100;
    pointer-events: auto;
}

.insert-coin-text {
    font-size: 16px;
    color: red;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    animation: blink 1s infinite step-start;
    cursor: pointer;
    margin-bottom: 5px;
    user-select: none;
    transition: all 0.2s;
}

.insert-coin-text:active {
    transform: scale(0.95);
}

.credit-counter {
    font-size: 12px;
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    user-select: none;
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}


.progress-label {
    font-size: 10px;
    color: var(--blue);
    text-align: right;
    margin-bottom: 2px;
    letter-spacing: 2px;
    width: 100%;
}

.progress-section {
    margin-top: 35px;
    width: 100%;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
}

.slug-character {
    position: absolute;
    bottom: 12px;
    left: 0%;
    width: 55px;
    height: 55px;
    background-image: url('https://www.fightersgeneration.com/nx8/char/marco-metalslug-walker.gif');
    background-size: contain;
    background-position: center bottom;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    transform: translateX(-50%);
    z-index: 100;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
    transition: left 1s linear;
}

.progress-wrapper {
    height: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    padding: 2px;
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
    background-size: 200% 100%;
    width: 0%;
    transition: width 1s ease-out;
    box-shadow: 0 0 15px rgba(234, 210, 125, 0.4);
    animation: barShimmer 3s linear infinite;
}

@keyframes barShimmer {
    0% { background-position: 200% 0%; }
    100% { background-position: 0% 0%; }
}

@media (max-width: 420px) {
    .main-logo { width: 180px; }
    .countdown { gap: 6px; }
    .time-box { min-width: 60px; flex: 1 1 60px; }
    .number { font-size: 20px; }
    .coupon-text { font-size: 8px; }
    .coupon-text span { font-size: 11px; }
    .link-btn { font-size: 8px; padding: 6px 10px; }
}


</style>
</head>

<body>


<div class="crt" id="crt">

    <img src="res/logo_icon.svg" class="floating-logo" id="floatingLogo">

    <div class="container">

        <img src="res/main-logo.png" class="main-logo">

        <div class="countdown">
            <div class="time-box"><div id="days" class="number">00</div><div class="label">DAYS</div></div>
            <div class="time-box"><div id="hours" class="number">00</div><div class="label">HOURS</div></div>
            <div class="time-box"><div id="minutes" class="number">00</div><div class="label">MIN</div></div>
            <div class="time-box"><div id="seconds" class="number">00</div><div class="label">SEC</div></div>
        </div>

        <div class="footer">LAUNCH: 12 NOV 2026</div>

        <div class="links-section">
            <div class="coupon-text" id="couponText"><span>LOCKED</span> INSERT COINS TO UNLOCK</div>
            <div class="links-row">
                <a href="https://plaionreplai.com/products/neogeo-aes" target="_blank" class="link-btn">NEOGEO AES (PLAION)</a>
                <a href="https://plaionreplai.com/products/neogeo-aes-anniversary-edition" target="_blank" class="link-btn">ANNIVERSARY ED. (PLAION)</a>
                <a href="https://plaionreplai.com/products/neogeo-aes-ultimate-edition" target="_blank" class="link-btn">ULTIMATE ED. (PLAION)</a>
            </div>
            <div class="links-row">
                <a href="https://www.todoconsolas.com/400-neogeo" target="_blank" class="link-btn">TODOCONSOLAS</a>
                <a href="https://www.amazon.es/s?k=neogeo+aes" target="_blank" class="link-btn">AMAZON.ES</a>
                <a href="https://www.game.es/buscar/neogeo" target="_blank" class="link-btn">GAME.ES</a>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-label">
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-wrapper">
                <div id="slugCharacter" class="slug-character"></div>
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

    </div>
    
    <div class="arcade-hud">
        <div id="insertCoinText" class="insert-coin-text">INSERT COIN</div>
        <div class="credit-counter">CREDIT <span id="creditCount">00</span></div>
    </div>
</div>

<div class="legal-footer">
SNK / Neo Geo trademarks © SNK Corporation. Fan project non-commercial.
</div>

<audio id="biosSound" preload="auto">
    <source src="res/neogeo-bios.mp3" type="audio/mpeg">
</audio>

<audio id="easterEggSound" preload="auto">
    <source src="res/metal-slug-hmg.mp3" type="audio/mpeg">
</audio>

<audio id="coinSound" preload="auto">
    <source src="res/insert-coin.mp3" type="audio/mpeg">
</audio>

<audio id="thankYouSound" preload="auto">
    <source src="res/thank-you.mp3" type="audio/mpeg">
</audio>

<script>

const backgrounds = [
    "res/mainback_neogeo.jpg",
    "res/mainback_neogeo_2.jpg"
];

const crt = document.getElementById("crt");
const logo = document.getElementById("floatingLogo");
const audio = document.getElementById("biosSound");

document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('dragstart', e => e.preventDefault());

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) e.preventDefault();
});

let taps = 0;
let lastTap = 0;
let locked = false;

function randomBg() {
    const bg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
    crt.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)), url('${bg}')`;
}

randomBg();
setInterval(randomBg, 6000);

function triggerSound() {
    audio.currentTime = 0;
    audio.volume = 1.0;
    audio.play().catch(() => {});
}

function glitchMode() {
    if (locked) return;

    locked = true;
    crt.classList.add("glitch");

    triggerSound();

    setTimeout(() => {
        crt.classList.remove("glitch");
        taps = 0;
        locked = false;
    }, 1500);
}

function handleTap() {
    if (locked) return;

    const now = Date.now();

    if (now - lastTap > 1200) {
        taps = 0;
    }

    lastTap = now;
    taps++;

    if (taps >= 3) {
        glitchMode();
    }
}

logo.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handleTap();
});

let logoX = Math.random() * 80 + 10;
let logoY = Math.random() * 80 + 10;
let velX = (Math.random() - 0.5) * 0.08;
let velY = (Math.random() - 0.5) * 0.08;

function updateLogo() {
    logoX += velX;
    logoY += velY;
    
    if (logoX <= 2 || logoX >= 88) {
        velX *= -1;
        logoX = Math.max(2, Math.min(88, logoX));
    }
    if (logoY <= 2 || logoY >= 88) {
        velY *= -1;
        logoY = Math.max(2, Math.min(88, logoY));
    }
    
    if (Math.random() < 0.002) {
        velX = (Math.random() - 0.5) * 0.15;
        velY = (Math.random() - 0.5) * 0.15;
    }
    
    logo.style.left = logoX + "%";
    logo.style.top = logoY + "%";
    requestAnimationFrame(updateLogo);
}
updateLogo();

const startDate = new Date(2026, 3, 16, 0, 0, 0); 
const targetDate = new Date(2026, 10, 12, 0, 0, 0); 

function update() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) return;

    const s = Math.floor(diff / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;

    document.getElementById("days").textContent = String(d).padStart(2,"0");
    document.getElementById("hours").textContent = String(h).padStart(2,"0");
    document.getElementById("minutes").textContent = String(m).padStart(2,"0");
    document.getElementById("seconds").textContent = String(sec).padStart(2,"0");

    const total = targetDate - startDate;
    const elapsed = now - startDate;
    const progress = Math.min(Math.max((elapsed / total) * 100, 0), 100);
    
    const progressBar = document.getElementById("progressBar");
    const progressPercent = document.getElementById("progressPercent");
    
    if (progressBar) progressBar.style.width = progress + "%";
    if (progressPercent) progressPercent.textContent = progress.toFixed(5) + "%";

    const slug = document.getElementById("slugCharacter");
    if (slug) {
        slug.style.left = progress + "%";
    }
}

setInterval(update, 1000);
update();

const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiIndex = 0;
const easterEggSound = document.getElementById("easterEggSound");

document.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        if (konamiIndex > 0) e.preventDefault();
    }

    if (e.key === konamiCode[konamiIndex] || e.key.toLowerCase() === konamiCode[konamiIndex].toLowerCase()) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
            easterEggSound.currentTime = 0;
            easterEggSound.volume = 1.0;
            easterEggSound.play().catch(() => {});
            
            crt.classList.add("glitch");
            setTimeout(() => crt.classList.remove("glitch"), 2000);

            konamiIndex = 0;
        }
    } else {
        konamiIndex = 0;
    }
});

const insertCoinBtn = document.getElementById("insertCoinText");
const creditCountDisplay = document.getElementById("creditCount");
const coinSound = document.getElementById("coinSound");
const couponText = document.getElementById("couponText");
let credits = 0;

insertCoinBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    
    coinSound.currentTime = 0;
    coinSound.volume = 1.0;
    coinSound.play().catch(() => {});
    
    credits++;
    creditCountDisplay.textContent = String(credits).padStart(2, "0");
    
    if (credits === 4 && couponText) {
        couponText.innerHTML = 'EXCLUSIVE PLAION COUPON: <span id="couponCode">WELCOME5</span>';
        
        const couponCode = document.getElementById("couponCode");
        couponCode.addEventListener("click", () => {
            const code = "WELCOME5";
            navigator.clipboard.writeText(code).then(() => {
                const originalText = couponCode.textContent;
                couponCode.textContent = "COPIED!";
                couponCode.style.color = "var(--gold)";
                couponCode.style.borderColor = "var(--gold)";
                
                const thankYouSound = document.getElementById("thankYouSound");
                if (thankYouSound) {
                    thankYouSound.currentTime = 0;
                    thankYouSound.volume = 1.0;
                    thankYouSound.play().catch(() => {});
                }
                
                setTimeout(() => {
                    couponCode.textContent = originalText;
                    couponCode.style.color = "white";
                    couponCode.style.borderColor = "var(--blue)";
                }, 1500);
            });
        });
    }
    
    if (credits >= 4 && insertCoinBtn.textContent !== "PRESS START") {
        insertCoinBtn.textContent = "PRESS START";
        insertCoinBtn.style.color = "var(--blue)";
        insertCoinBtn.style.textShadow = "0 0 10px rgba(0, 217, 255, 0.8)";
    }
});



</script>

</body>
</html>
